name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build site and run integrity checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build the Jekyll site
        run: bundle exec jekyll build --safe --config _config.yml,_config.preview.yml
      - name: Check internal links
        run: python3 scripts/check_links.py _site
      - name: Check category pages are in sync
        run: bundle exec ruby scripts/sync_categories.rb --check
